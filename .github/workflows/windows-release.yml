name: Acadex Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "windows-v*"
    branches:
      - "windows-native-client"
    paths:
      - "windows/**"
      - ".github/workflows/windows-release.yml"
  pull_request:
    paths:
      - "windows/**"
      - ".github/workflows/windows-release.yml"

permissions:
  contents: write

jobs:
  build-test-package:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore windows/Acadex.Windows.sln

      - name: Build Release
        run: dotnet build windows/Acadex.Windows.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test windows/Acadex.Windows.Tests/Acadex.Windows.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=windows-tests.trx"

      - name: Publish self-contained app
        run: dotnet publish windows/Acadex.Windows/Acadex.Windows.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=false -p:IncludeNativeLibrariesForSelfExtract=true -o windows/publish

      - name: Install Inno Setup
        if: startsWith(github.ref, 'refs/tags/windows-v')
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        if: startsWith(github.ref, 'refs/tags/windows-v')
        shell: pwsh
        run: |
          $iscc = "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler missing at $iscc" }
          & $iscc "windows/installer/Acadex.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "windows/installer/Output/Acadex-Setup.exe")) { throw "Installer output was not produced." }

      - name: Upload CI publish artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Acadex-Windows-win-x64
          path: windows/publish/
          if-no-files-found: error
          retention-days: 14

      - name: Upload installer artifact
        if: startsWith(github.ref, 'refs/tags/windows-v')
        uses: actions/upload-artifact@v4
        with:
          name: Acadex-Setup
          path: windows/installer/Output/Acadex-Setup.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/windows-v')
        uses: softprops/action-gh-release@v2
        with:
          files: windows/installer/Output/Acadex-Setup.exe
          name: Acadex Windows ${{ github.ref_name }}
          generate_release_notes: true